<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="House with tools and a booking confirmation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- soft background circle -->
  <circle cx="300" cy="270" r="215" fill="#ffffff" opacity="0.12"/>
  <circle cx="300" cy="270" r="160" fill="#ffffff" opacity="0.08"/>

  <!-- ground shadow -->
  <ellipse cx="300" cy="445" rx="200" ry="18" fill="#0f172a" opacity="0.18"/>

  <!-- house -->
  <rect x="365" y="172" width="28" height="60" rx="4" fill="#bfdbfe"/>
  <rect x="190" y="250" width="220" height="190" rx="14" fill="#ffffff"/>
  <polygon points="165,262 300,148 435,262" fill="#bfdbfe"/>
  <polygon points="165,262 300,148 435,262" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <rect x="270" y="340" width="60" height="100" rx="8" fill="#1d4ed8"/>
  <circle cx="318" cy="392" r="4" fill="#fbbf24"/>
  <rect x="213" y="285" width="42" height="42" rx="7" fill="#dbeafe"/>
  <rect x="345" y="285" width="42" height="42" rx="7" fill="#dbeafe"/>
  <path d="M234 285v42M213 306h42M366 285v42M345 306h42" stroke="#ffffff" stroke-width="4"/>

  <!-- location pin -->
  <path d="M300 56C280 56 268 71 268 86C268 108 300 136 300 136C300 136 332 108 332 86C332 71 320 56 300 56Z" fill="#f87171"/>
  <circle cx="300" cy="86" r="11" fill="#ffffff"/>

  <!-- wrench (left) -->
  <g transform="translate(110 300) rotate(75)" fill="none" stroke="#fbbf24" stroke-width="18" stroke-linecap="round">
    <path d="M-19.05 -11A22 22 0 1 1 -19.05 11"/>
    <line x1="20" y1="0" x2="150" y2="0"/>
  </g>

  <!-- screwdriver (right) -->
  <g transform="translate(500 350) rotate(20)">
    <rect x="-4" y="-80" width="8" height="82" rx="3" fill="#e2e8f0"/>
    <polygon points="-4,-80 4,-80 0,-94" fill="#e2e8f0"/>
    <rect x="-15" y="0" width="30" height="72" rx="11" fill="#f87171"/>
    <rect x="-15" y="20" width="30" height="8" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- booking confirmed card -->
  <g>
    <rect x="410" y="86" width="150" height="84" rx="16" fill="#ffffff"/>
    <circle cx="446" cy="128" r="18" fill="#22c55e"/>
    <path d="M437 128l7 7 13-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="474" y="124" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Booked!</text>
    <rect x="474" y="134" width="62" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="474" y="148" width="42" height="7" rx="3.5" fill="#e2e8f0"/>
  </g>

  <!-- rating badge -->
  <g>
    <rect x="50" y="110" width="132" height="52" rx="26" fill="#ffffff"/>
    <polygon points="84,124 88,133 98,134 90,141 93,151 84,146 75,151 78,141 70,134 80,133" fill="#fbbf24"/>
    <text x="108" y="144" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">4.9</text>
  </g>

  <!-- sparkles -->
  <circle cx="520" cy="240" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="75" cy="230" r="5" fill="#ffffff" opacity="0.5"/>
  <circle cx="540" cy="300" r="3.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="40" cy="360" r="4" fill="#ffffff" opacity="0.4"/>
</svg>
