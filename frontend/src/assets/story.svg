<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="A phone showing local service providers, with houses in a neighbourhood" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0efff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="260" y="76" width="120" height="258" rx="14"/>
    </clipPath>
    <clipPath id="frame">
      <rect width="640" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="640" height="420" fill="url(#bg)"/>

    <!-- sun and clouds -->
    <circle cx="540" cy="70" r="34" fill="#fde68a"/>
    <g fill="#ffffff" opacity="0.85">
      <ellipse cx="90" cy="70" rx="42" ry="16"/>
      <ellipse cx="120" cy="58" rx="28" ry="16"/>
      <ellipse cx="430" cy="48" rx="34" ry="12"/>
      <ellipse cx="452" cy="40" rx="22" ry="12"/>
    </g>

    <!-- ground -->
    <path d="M0 336 Q160 306 320 334 T640 322 L640 420 L0 420 Z" fill="#93c5fd"/>
    <path d="M0 372 Q200 350 400 372 T640 366 L640 420 L0 420 Z" fill="#60a5fa" opacity="0.6"/>

    <!-- left house -->
    <rect x="52" y="246" width="96" height="92" rx="6" fill="#ffffff"/>
    <polygon points="40,252 100,204 160,252" fill="#1d4ed8"/>
    <rect x="86" y="284" width="26" height="54" rx="4" fill="#1d4ed8"/>
    <rect x="62" y="262" width="20" height="20" rx="3" fill="#dbeafe"/>
    <rect x="118" y="262" width="20" height="20" rx="3" fill="#dbeafe"/>

    <!-- right house -->
    <rect x="486" y="256" width="86" height="82" rx="6" fill="#ffffff"/>
    <polygon points="476,262 529,216 582,262" fill="#3b82f6"/>
    <rect x="516" y="294" width="24" height="44" rx="4" fill="#1d4ed8"/>
    <rect x="496" y="272" width="18" height="18" rx="3" fill="#dbeafe"/>
    <rect x="544" y="272" width="18" height="18" rx="3" fill="#dbeafe"/>

    <!-- tree -->
    <rect x="606" y="296" width="8" height="42" rx="3" fill="#92400e"/>
    <circle cx="610" cy="282" r="24" fill="#22c55e"/>
    <circle cx="598" cy="294" r="14" fill="#16a34a"/>

    <!-- phone -->
    <rect x="250" y="62" width="140" height="290" rx="26" fill="#0f1e4a"/>
    <rect x="260" y="76" width="120" height="258" rx="14" fill="#ffffff"/>
    <g clip-path="url(#screen)">
      <rect x="260" y="76" width="120" height="36" fill="#1d4ed8"/>
      <text x="320" y="99" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Fixora</text>

      <!-- provider rows -->
      <g>
        <circle cx="282" cy="140" r="12" fill="#dbeafe"/>
        <rect x="302" y="132" width="52" height="6" rx="3" fill="#cbd5e1"/>
        <rect x="302" y="144" width="34" height="6" rx="3" fill="#e2e8f0"/>
        <circle cx="366" cy="140" r="5" fill="#22c55e"/>
      </g>
      <g>
        <circle cx="282" cy="186" r="12" fill="#dbeafe"/>
        <rect x="302" y="178" width="52" height="6" rx="3" fill="#cbd5e1"/>
        <rect x="302" y="190" width="34" height="6" rx="3" fill="#e2e8f0"/>
        <circle cx="366" cy="186" r="5" fill="#22c55e"/>
      </g>
      <g>
        <circle cx="282" cy="232" r="12" fill="#dbeafe"/>
        <rect x="302" y="224" width="52" height="6" rx="3" fill="#cbd5e1"/>
        <rect x="302" y="236" width="34" height="6" rx="3" fill="#e2e8f0"/>
        <circle cx="366" cy="232" r="5" fill="#22c55e"/>
      </g>

      <!-- book button -->
      <rect x="274" y="284" width="92" height="30" rx="15" fill="#1d4ed8"/>
      <text x="320" y="303" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Book now</text>
    </g>

    <!-- floating card: rated provider -->
    <g>
      <rect x="44" y="104" width="160" height="54" rx="16" fill="#ffffff"/>
      <circle cx="74" cy="131" r="16" fill="#fbbf24"/>
      <path d="M67 131l5 5 9-10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="127" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Verified plumber</text>
      <polygon points="108,136 110.5,141.5 116.5,142 112,146 113.5,152 108,148.8 102.5,152 104,146 99.5,142 105.5,141.5" fill="#fbbf24"/>
      <text x="122" y="150" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">4.9</text>
    </g>

    <!-- floating card: booked -->
    <g>
      <rect x="426" y="118" width="170" height="54" rx="16" fill="#ffffff"/>
      <circle cx="456" cy="145" r="16" fill="#22c55e"/>
      <path d="M448 145l6 6 11-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="482" y="141" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Booking confirmed</text>
      <rect x="482" y="150" width="60" height="6" rx="3" fill="#cbd5e1"/>
    </g>

    <!-- location pins -->
    <path d="M100 176c-8 0-14 6-14 14 0 11 14 24 14 24s14-13 14-24c0-8-6-14-14-14z" fill="#f87171" transform="translate(0 -2)"/>
    <circle cx="100" cy="188" r="5" fill="#ffffff"/>
    <path d="M529 170c-7 0-12 5-12 12 0 10 12 20 12 20s12-10 12-20c0-7-5-12-12-12z" fill="#f87171" transform="translate(0 4)"/>
    <circle cx="529" cy="182" r="4.5" fill="#ffffff"/>
  </g>
</svg>
